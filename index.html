
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopNest - Online Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">ShopNest</div>

        <input type="text" id="searchInput"
               placeholder="Search products...">

        <button id="cartButton">🛒 Cart (<span id="cartCount">0</span>)</button>
    </header>

    <section class="hero">
        <h1>Find Your Favourite Products</h1>
        <p>Great products, simple shopping.</p>
    </section>

    <main>
        <div class="toolbar">
            <h2>Our Products</h2>

            <select id="categoryFilter">
                <option value="all">All Categories</option>
                <option value="Electronics">Electronics</option>
                <option value="Fashion">Fashion</option>
                <option value="Accessories">Accessories</option>
            </select>
        </div>

        <div id="productList" class="product-grid"></div>

        <p id="noProducts" class="hidden">No products found.</p>

        <section id="cartSection" class="cart-section hidden">
            <div class="cart-heading">
                <h2>Your Shopping Cart</h2>
                <button id="closeCart" class="secondary">Close</button>
            </div>

            <div id="cartItems"></div>

            <div class="cart-footer">
                <h3>Total: ₹<span id="cartTotal">0</span></h3>
                <button id="clearCart" class="secondary">Clear Cart</button>
                <button id="checkoutButton">Checkout</button>
            </div>
        </section>
    </main>

    <footer>
        <p>© <span id="year"></span> ShopNest. Demo shopping website.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
